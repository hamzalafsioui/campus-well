name: campuswell

services:
  jupyter:
    image: campuswell:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuswell-jupyter
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=
      - --ServerApp.password=
      - --IdentityProvider.token=
    healthcheck:
      test: ["CMD-SHELL", "curl -f -L http://localhost:8888/lab || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  streamlit:
    image: campuswell:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuswell-streamlit
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${STREAMLIT_PORT:-8502}:8501"
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  airflow:
    image: campuswell:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuswell-airflow
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./airflow_home:/opt/airflow
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    command:
      - airflow
      - standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
